<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödəniş Alınmadı — Mobilim.az</title>
    <link rel="stylesheet" href="CSS/general.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('mobilaz_theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary, #f8fafc);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-primary, #0f172a);
        }
        [data-theme="dark"] body {
            background: #0b1120;
            color: #f1f5f9;
        }
        .status-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg, #ffffff);
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid var(--border-color, #e2e8f0);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        [data-theme="dark"] .status-container {
            background: #1e293b;
            border-color: #334155;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status-header {
            text-align: center;
            padding: 40px 30px 20px;
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, transparent 100%);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #ef4444;
            color: #ffffff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 12px 24px -6px rgba(239, 68, 68, 0.4);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .status-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            margin: 20px 0 8px 0;
        }
        [data-theme="dark"] .status-title { color: #f8fafc; }
        .status-desc {
            font-size: 15px;
            color: var(--text-secondary, #64748b);
            margin: 0;
            line-height: 1.5;
        }
        .details-card {
            margin: 20px 30px;
            background: var(--bg-secondary, #f8fafc);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 14px;
            padding: 18px;
        }
        [data-theme="dark"] .details-card {
            background: #0f172a;
            border-color: #334155;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color, #e2e8f0);
            font-size: 14px;
        }
        [data-theme="dark"] .detail-row {
            border-color: #334155;
        }
        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .detail-label {
            color: var(--text-secondary, #64748b);
        }
        .detail-value {
            font-weight: 600;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .actions-block {
            padding: 10px 30px 35px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-retry {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ef4444;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-retry:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            color: var(--text-secondary, #64748b);
            font-weight: 500;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .btn-secondary:hover {
            color: var(--text-primary, #0f172a);
        }
        .badge-failed {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="status-container">
        <div class="status-header">
            <div class="icon-circle">
                <i class="fas fa-times"></i>
            </div>
            <h1 class="status-title">Ödəniş alınmadı</h1>
            <p class="status-desc">Əməliyyat bank və ya ödəniş sistemi tərəfindən dayandırıldı.</p>
        </div>

        <div class="details-card">
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="badge-failed"><i class="fas fa-exclamation-circle"></i> Tamamlanmadı</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Səbəb</span>
                <span class="detail-value" id="reasonValue">Məlum olmayan səbəb</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Tarix</span>
                <span class="detail-value" style="color: var(--text-primary, #0f172a);" id="dateValue">—</span>
            </div>
        </div>

        <div class="actions-block">
            <a href="cabinet.html#billing" class="btn-retry" id="btnRetry">
                <i class="fas fa-redo"></i> Yenidən Cəhd Et
            </a>
            <a href="cabinet.html" class="btn-secondary">
                <i class="fas fa-wallet"></i> Şəxsi Kabinetə Qayıt
            </a>
        </div>
    </div>

    <script>
        (function initFailedPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const reason = urlParams.get('reason') || urlParams.get('error') || urlParams.get('message') || '';
            const reasonEl = document.getElementById('reasonValue');
            const dateEl = document.getElementById('dateValue');

            dateEl.textContent = new Date().toLocaleString('az-AZ', {
                year: 'numeric', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });

            if (reason) {
                const map = {
                    'cancelled': 'Ödəniş istifadəçi tərəfindən ləğv edildi',
                    'rejected': 'Bank tərəfindən imtina edildi',
                    'insufficient_funds': 'Kartda kifayət qədər vəsait yoxdur',
                    'expired': 'Ödəniş sessiyasının vaxtı bitdi',
                    'declined': 'Əməliyyat rədd edildi'
                };
                reasonEl.textContent = map[reason.toLowerCase()] || reason;
            } else {
                reasonEl.textContent = 'Kart məlumatları və ya əməliyyat vaxtı bitdi';
            }
        })();
    </script>
</body>
</html>
