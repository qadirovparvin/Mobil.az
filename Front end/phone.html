<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telefonlar - Mobilim.az</title>
  <link rel="stylesheet" href="CSS/general.css">
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/stores.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('mobilaz_theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body>
    <div id="header-placeholder"></div>

  <main>
    
    <div class="second-container">
      <div class="search-options">
        <div class="catalog-dropdown">
          <button class="catalog-button" aria-expanded="false" aria-haspopup="true" aria-controls="catalog-menu">
            <i class="fas fa-bars"></i>
            <span data-translate="catalog-button">Kataloq</span>
          </button>
          <div class="catalog-menu" id="catalog-menu">
            <a href="phone.html?category=phone"><i class="fas fa-mobile-alt"></i> <span class="phone"
                data-translate="phone">Telefonlar</span></a>
            <a href="phone.html?category=tablet"><i class="fas fa-tablet-alt"></i><span class="tablet"
                data-translate="tablet">Planşetlər</span></a>
            <a href="phone.html?category=headphone"><i class="fas fa-headphones"></i><span class="headphone" data-translate="headphone">
                Qulaqcıqlar</span></a>
            <a href="phone.html?category=accessory"><i class="fas fa-plug"></i> <span class="phone-accessories"
                data-translate="phone-accessories">Telefon aksessuarları</span></a>
          </div>
        </div>
        <input type="text" placeholder="Telefon axtar...">
        <button class="search-btn" data-translate="search-btn">Axtar</button>

        <div class="sidebar-filters">
          <button id="filterToggle" class="filter-toggle">
            <i class="fas fa-sliders-h"></i>
            <span class="search-in-more-detail" data-translate="search-in-more-detail">Daha ətraflı axtar</span>
            <span class="filter-badge" id="filterBadge" style="display:none">0</span>
          </button>

          <div id="filterBody" class="filter-body">

            <!-- Brand & Model -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-tag"></i> <span class="brand"
                  data-translate="brand">Marka</span></label>
              <select class="filter-select" id="brandSelect" data-filter="brand">
                <option value="" class="all-brand" data-translate="all-brand">Bütün markalar</option>
                <option>Apple</option>
                <option>Samsung</option>
                <option>Xiaomi</option>
                <option>Huawei</option>
                <option>OPPO</option>
                <option>Vivo</option>
                <option>Honor</option>
                <option>Realme</option>
                <option>Nokia</option>
                <option value="other" data-translate="other">Digər</option>
              </select>
            </div>

            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-mobile-alt"></i> Model</label>
              <select class="filter-select" id="modelSelect" data-filter="model">
                <option value="" data-translate="select-brand">Əvvəlcə marka seçin</option>
              </select>
            </div>

            <!-- Price -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-money-bill-wave"></i> <span class="price-range"
                  data-translate="price-range">Qiymət aralığı</span></label>
              <div class="price-inputs">
                <div class="price-input-group">
                  <input type="number" class="price-input" id="priceMin" placeholder="Min">
                  <span>AZN</span>
                </div>
                <div class="price-input-group">
                  <input type="number" class="price-input" id="priceMax" placeholder="Max">
                  <span>AZN</span>
                </div>
              </div>
            </div>

            <!-- City -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-map-marker-alt"></i> <span class="city"
                  data-translate="city">Şəhər</span></label>
              <select class="filter-select" data-filter="city">
                <option value="" class="all-city" data-translate="all-city"> - Bütün şəhərlər - </option>
                <option value="Baku" class="Baku" data-translate="Baku"> Bakı </option>
                <option value="Sumqayit" class="Sumqayit" data-translate="Sumqayit"> Sumqayıt </option>
                <option value="Ganja" class="Ganja" data-translate="Ganja"> Gəncə </option>
                <option value="Absheron" class="Absheron" data-translate="Absheron"> Abşeron </option>
                <option value="Agcabedi" class="Agcabedi" data-translate="Agcabedi"> Ağcabədi </option>
                <option value="Agdam" class="Agdam" data-translate="Agdam"> Ağdam </option>
                <option value="Agdash" class="Agdash" data-translate="Agdash"> Ağdaş </option>
                <option value="Agstafa" class="Agstafa" data-translate="Agstafa"> Ağstafa </option>
                <option value="Agsu" class="Agsu" data-translate="Agsu"> Ağsu </option>
                <option value="Astara" class="Astara" data-translate="Astara"> Astara </option>
                <option value="Balakan" class="Balakan" data-translate="Balakan"> Balakən </option>
                <option value="Beylagan" class="Beylagan" data-translate="Beylagan"> Beyləqan </option>
                <option value="Barda" class="Barda" data-translate="Barda"> Bərdə </option>
                <option value="Bilasuvar" class="Bilasuvar" data-translate="Bilasuvar"> Biləsuvar </option>
                <option value="Dashkasan" class="Dashkasan" data-translate="Dashkasan"> Daşkəsən </option>
                <option value="Fuzuli" class="Fuzuli" data-translate="Fuzuli"> Füzuli </option>
                <option value="Gadabay" class="Gadabay" data-translate="Gadabay"> Gədəbəy </option>
                <option value="Goranboy" class="Goranboy" data-translate="Goranboy"> Goranboy </option>
                <option value="Goychay" class="Goychay" data-translate="Goychay"> Göyçay </option>
                <option value="Goygol" class="Goygol" data-translate="Goygol"> Göygöl </option>
                <option value="Hajigabul" class="Hajigabul" data-translate="Hajigabul"> Hacıqabul </option>
                <option value="Imishli" class="Imishli" data-translate="Imishli"> İmişli </option>
                <option value="Ismayilli" class="Ismayilli" data-translate="Ismayilli"> İsmayıllı </option>
                <option value="Jabrayil" class="Jabrayil" data-translate="Jabrayil"> Cəbrayıl </option>
                <option value="Jalilabad" class="Jalilabad" data-translate="Jalilabad"> Cəlilabad </option>
                <option value="Kalbajar" class="Kalbajar" data-translate="Kalbajar"> Kəlbəcər </option>
                <option value="Kurdamir" class="Kurdamir" data-translate="Kurdamir"> Kürdəmir </option>
                <option value="Lachin" class="Lachin" data-translate="Lachin"> Laçın </option>
                <option value="Lankaran" class="Lankaran" data-translate="Lankaran"> Lənkəran </option>
                <option value="Lerik" class="Lerik" data-translate="Lerik"> Lerik </option>
                <option value="Masalli" class="Masalli" data-translate="Masalli"> Masallı </option>
                <option value="Mingachevir" class="Mingachevir" data-translate="Mingachevir"> Mingəçevir </option>
                <option value="Naftalan" class="Naftalan" data-translate="Naftalan"> Naftalan </option>
                <option value="Nakhchivan" class="Nakhchivan" data-translate="Nakhchivan"> Naxçıvan </option>
                <option value="Neftchala" class="Neftchala" data-translate="Neftchala"> Neftçala </option>
                <option value="Oguz" class="Oguz" data-translate="Oguz"> Oğuz </option>
                <option value="Qabala" class="Qabala" data-translate="Qabala"> Qəbələ </option>
                <option value="Qakh" class="Qakh" data-translate="Qakh"> Qax </option>
                <option value="Qazakh" class="Qazakh" data-translate="Qazakh"> Qazax </option>
                <option value="Quba" class="Quba" data-translate="Quba"> Quba </option>
                <option value="Qubadli" class="Qubadli" data-translate="Qubadli"> Qubadlı </option>
                <option value="Qusar" class="Qusar" data-translate="Qusar"> Qusar </option>
                <option value="Saatli" class="Saatli" data-translate="Saatli"> Saatlı </option>
                <option value="Sabirabad" class="Sabirabad" data-translate="Sabirabad"> Sabirabad </option>
                <option value="Salyan" class="Salyan" data-translate="Salyan"> Salyan </option>
                <option value="Shabran" class="Shabran" data-translate="Shabran"> Şabran </option>
                <option value="Shaki" class="Shaki" data-translate="Shaki"> Şəki </option>
                <option value="Shamakhi" class="Shamakhi" data-translate="Shamakhi"> Şamaxı </option>
                <option value="Shirvan" class="Shirvan" data-translate="Shirvan"> Şirvan </option>
                <option value="Shusha" class="Shusha" data-translate="Shusha"> Şuşa </option>
                <option value="Siazan" class="Siazan" data-translate="Siazan"> Siyəzən </option>
                <option value="Tartar" class="Tartar" data-translate="Tartar"> Tərtər </option>
                <option value="Tovuz" class="Tovuz" data-translate="Tovuz"> Tovuz </option>
                <option value="Ujar" class="Ujar" data-translate="Ujar"> Ucar </option>
                <option value="Yardimli" class="Yardimli" data-translate="Yardimli"> Yardımlı </option>
                <option value="Yevlakh" class="Yevlakh" data-translate="Yevlakh"> Yevlax </option>
                <option value="Zangilan" class="Zangilan" data-translate="Zangilan"> Zəngilan </option>
                <option value="Zaqatala" class="Zaqatala" data-translate="Zaqatala"> Zaqatala </option>
                <option value="Zardab" class="Zardab" data-translate="Zardab"> Zərdab </option>
              </select>
            </div>

            <!-- Storage Memory -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-hdd"></i> <span data-translate="filter-memory-label">Yaddaş
                  (ROM)</span></label>
              <div class="memory-buttons filter-btn-group" data-group="memory">
                <button class="filter-pill memory-button" data-value="below-64"><span
                    data-translate="memory-button-below-64">64 GB-dən az</span></button>
                <button class="filter-pill memory-button" data-value="64"><span class="memory-button-64"
                    data-translate="memory-button-64">64 GB</span></button>
                <button class="filter-pill memory-button" data-value="128"><span class="memory-button-128"
                    data-translate="memory-button-128">128 GB</span></button>
                <button class="filter-pill memory-button" data-value="256"><span class="memory-button-256"
                    data-translate="memory-button-256">256 GB</span></button>
                <button class="filter-pill memory-button" data-value="512"><span class="memory-button-512"
                    data-translate="memory-button-512">512 GB</span></button>
                <button class="filter-pill memory-button" data-value="512+"><span class="memory-button-512-more"
                    data-translate="memory-button-512-more">512 GB+</span></button>
              </div>
            </div>

            <!-- RAM -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-memory"></i> <span
                  data-translate="filter-ram-label">RAM</span></label>
              <div class="ram-buttons filter-btn-group" data-group="ram">
                <button class="filter-pill ram-button" data-value="2"><span data-translate="ram-2gb">2
                    GB</span></button>
                <button class="filter-pill ram-button" data-value="4"><span data-translate="ram-4gb">4
                    GB</span></button>
                <button class="filter-pill ram-button" data-value="6"><span data-translate="ram-6gb">6
                    GB</span></button>
                <button class="filter-pill ram-button" data-value="8"><span data-translate="ram-8gb">8
                    GB</span></button>
                <button class="filter-pill ram-button" data-value="12"><span data-translate="ram-12gb">12
                    GB</span></button>
                <button class="filter-pill ram-button" data-value="16+"><span data-translate="ram-16gb">16
                    GB+</span></button>
              </div>
            </div>

            <!-- Screen Size -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-expand-arrows-alt"></i> <span
                  data-translate="filter-screen-label">Ekran ölçüsü</span></label>
              <div class="screen-buttons filter-btn-group" data-group="screen">
                <button class="filter-pill screen-button" data-value="small"><span
                    data-translate="screen-small">&lt;5.5"</span></button>
                <button class="filter-pill screen-button" data-value="medium"><span
                    data-translate="screen-medium">5.5–6.1"</span></button>
                <button class="filter-pill screen-button" data-value="large"><span
                    data-translate="screen-large">6.1–6.7"</span></button>
                <button class="filter-pill screen-button" data-value="xlarge"><span
                    data-translate="screen-xlarge">&gt;6.7"</span></button>
              </div>
            </div>

            <!-- Battery -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-battery-half"></i> <span
                  data-translate="filter-battery-label">Batareya</span></label>
              <div class="battery-buttons filter-btn-group" data-group="battery">
                <button class="filter-pill battery-button" data-value="low"><span data-translate="battery-low">&lt;3000
                    mAh</span></button>
                <button class="filter-pill battery-button" data-value="mid"><span
                    data-translate="battery-mid">3000–4500
                    mAh</span></button>
                <button class="filter-pill battery-button" data-value="high"><span
                    data-translate="battery-high">&gt;4500 mAh</span></button>
              </div>
            </div>

            <!-- Fingerprint -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-fingerprint"></i> <span class="finger-print-sensors"
                  data-translate="finger-print-sensors">Barmaq izi sensoru</span></label>
              <div class="fingerprint-buttons filter-btn-group" data-group="fingerprint">
                <button class="filter-pill fingerprint-button active" data-value="any"><span class="doesnt-matter"
                    data-translate="doesnt-matter">Fərqi yoxdur</span></button>
                <button class="filter-pill fingerprint-button" data-value="yes"><span class="Available"
                    data-translate="Available">Mövcuddur</span></button>
                <button class="filter-pill fingerprint-button" data-value="no"><span class="not-available"
                    data-translate="not-available">Yoxdur</span></button>
                <button class="filter-pill fingerprint-button" data-value="broken"><span class="not-working"
                    data-translate="Not working">İşləmir</span></button>
              </div>
            </div>

            <!-- NFC -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-wifi"></i> NFC</label>
              <div class="nfc-buttons filter-btn-group" data-group="nfc">
                <button class="filter-pill toggle-button active" data-value="any"><span class="doesnt-matter"
                    data-translate="doesnt-matter">Fərqi yoxdur</span></button>
                <button class="filter-pill toggle-button" data-value="yes"><span class="yes"
                    data-translate="yes">Bəli</span></button>
                <button class="filter-pill toggle-button" data-value="no"><span class="no"
                    data-translate="no">Xeyr</span></button>
              </div>
            </div>

            <!-- Water Resistance -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-tint"></i> <span class="water-resistance"
                  data-translate="Water resistance">Suya davamlılıq</span></label>
              <div class="waterproof-buttons filter-btn-group" data-group="waterproof">
                <button class="filter-pill toggle-button active" data-value="any"><span class="doesnt-matter"
                    data-translate="doesnt-matter">Fərqi yoxdur</span></button>
                <button class="filter-pill toggle-button" data-value="yes"><span class="yes"
                    data-translate="yes">Bəli</span></button>
                <button class="filter-pill toggle-button" data-value="no"><span class="no"
                    data-translate="no">Xeyr</span></button>
              </div>
            </div>

            <!-- Expandable Memory -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-sd-card"></i> <span class="additional-memory"
                  data-translate="Additional memory">Əlavə yaddaş</span></label>
              <div class="expandable-buttons filter-btn-group" data-group="expandable">
                <button class="filter-pill toggle-button active" data-value="any"><span class="doesnt-matter"
                    data-translate="doesnt-matter">Fərqi yoxdur</span></button>
                <button class="filter-pill toggle-button" data-value="yes"><span class="yes"
                    data-translate="yes">Bəli</span></button>
                <button class="filter-pill toggle-button" data-value="no"><span class="no"
                    data-translate="no">Xeyr</span></button>
              </div>
            </div>

            <!-- Condition -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-star-half-alt"></i> <span class="condition"
                  data-translate="condition">Vəziyyəti</span></label>
              <div class="condition-buttons filter-btn-group" data-group="condition">
                <button class="filter-pill condition-button active" data-value="both"><span class="both"
                    data-translate="both">Hər ikisi</span></button>
                <button class="filter-pill condition-button" data-value="new"><span class="new"
                    data-translate="new">Yeni</span></button>
                <button class="filter-pill condition-button" data-value="used"><span class="used"
                    data-translate="used">İşlənmiş</span></button>
              </div>
            </div>

            <!-- Delivery -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-truck"></i> <span class="Delivery"
                  data-translate="Delivery">Çatdırılma</span></label>
              <div class="delivery-buttons filter-btn-group" data-group="delivery">
                <button class="filter-pill toggle-button active" data-value="any"><span class="doesnt-matter"
                    data-translate="doesnt-matter">Fərqi yoxdur</span></button>
                <button class="filter-pill toggle-button" data-value="yes"><span class="yes"
                    data-translate="yes">Bəli</span></button>
                <button class="filter-pill toggle-button" data-value="no"><span class="no"
                    data-translate="no">Xeyr</span></button>
              </div>
            </div>

            <!-- Seller Type -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-user-tag"></i> <span
                  data-translate="filter-seller-label">Satıcı növü</span></label>
              <div class="seller-buttons filter-btn-group" data-group="seller">
                <button class="filter-pill toggle-button active" data-value="any"><span class="doesnt-matter"
                    data-translate="doesnt-matter">Fərqi yoxdur</span></button>
                <button class="filter-pill toggle-button" data-value="private"><span
                    data-translate="seller-private">Şəxsi</span></button>
                <button class="filter-pill toggle-button" data-value="store"><span
                    data-translate="seller-store">Mağaza</span></button>
              </div>
            </div>

            <!-- Color (multi-select) -->
            <div class="filter-group">
              <label class="filter-label"><i class="fas fa-palette"></i> <span class="color"
                  data-translate="color">Rəng</span></label>
              <div class="color-buttons filter-btn-group color-multi" data-group="color">
                <button class="filter-pill color-button" data-value="white"
                  style="background:#f8f8f8;border:2px solid #ccc;color:#333"><span class="white"
                    data-translate="white">Ağ</span></button>
                <button class="filter-pill color-button" data-value="black" style="background:#1a1a1a;color:#fff"><span
                    class="black" data-translate="black">Qara</span></button>
                <button class="filter-pill color-button" data-value="grey" style="background:#808080;color:#fff"><span
                    class="grey" data-translate="grey">Boz</span></button>
                <button class="filter-pill color-button" data-value="blue" style="background:#1a6ab8;color:#fff"><span
                    class="blue" data-translate="blue">Göy</span></button>
                <button class="filter-pill color-button" data-value="red" style="background:#cc2200;color:#fff"><span
                    class="red" data-translate="red">Qırmızı</span></button>
                <button class="filter-pill color-button" data-value="green" style="background:#267326;color:#fff"><span
                    class="green" data-translate="green">Yaşıl</span></button>
                <button class="filter-pill color-button" data-value="yellow" style="background:#f5c400;color:#333"><span
                    class="yellow" data-translate="yellow">Sarı</span></button>
                <button class="filter-pill color-button" data-value="orange" style="background:#e67300;color:#fff"><span
                    class="orange" data-translate="orange">Narıncı</span></button>
                <button class="filter-pill color-button" data-value="pink" style="background:#e8699a;color:#fff"><span
                    class="pink" data-translate="pink">Çəhrayı</span></button>
                <button class="filter-pill color-button" data-value="purple" style="background:#6a1fa0;color:#fff"><span
                    class="purple" data-translate="purple">Bənövşəyi</span></button>
                <button class="filter-pill color-button" data-value="brown" style="background:#7a3b10;color:#fff"><span
                    class="brown" data-translate="brown">Qəhvəyi</span></button>
                <button class="filter-pill color-button" data-value="gold"
                  style="background:linear-gradient(135deg,#c8a600,#ffd700);color:#333"><span class="gold"
                    data-translate="gold">Qızılı</span></button>
                <button class="filter-pill color-button" data-value="silver"
                  style="background:linear-gradient(135deg,#aaa,#d8d8d8);color:#333"><span class="silver"
                    data-translate="silver">Gümüşü</span></button>
              </div>
            </div>

            <!-- Actions -->
            <div class="filter-actions">
              <button class="btn-apply"><i class="fas fa-check"></i> <span class="apply-select"
                  data-translate="apply-select">Filterləri tətbiq et</span></button>
              <button class="btn-reset"><i class="fas fa-undo-alt"></i> <span class="reset-btn"
                  data-translate="reset-btn">Sıfırla</span></button>
            </div>

            <!-- Active filter chips -->
            <div class="active-filters" id="activeFiltersContainer" style="display:none">
              <h4 class="active-filters-title"><i class="fas fa-tags"></i> <span data-translate="active-filters">Aktiv
                  filterlər:</span></h4>
              <div class="filter-chips" id="filterChips"></div>
            </div>

          </div><!-- /filter-body -->
        </div><!-- /sidebar-filters -->

        <div class="sidebar-post-ad">
          <a href="elan-yerlesdir.html">
            <button id="elanToggle" class="elan-toggle">
              <i class="fas fa-plus-circle"></i><span class="new-add" data-translate="new-announcement"> Yeni
                Elan</span>
            </button>
          </a>
        </div><!-- /sidebar-post-ad -->
      </div>
    </div>
    <div class="third-container">
      <section class="all-ads-section">
        <div class="all-ads-header">
          <h2 class="all-ads-title" data-translate="phone-h2">Telefon modelləri</h2>
        </div>

        <div id="phone-ads-container" class="all-ads-container"></div>
        <div id="load-more-container" class="load-more-container" style="text-align: center; margin: 32px 0; display: none;">
          <button id="loadMoreBtn" class="load-more-btn" style="padding: 12px 32px; font-size: 15px; font-weight: 600; border-radius: 12px; background: var(--accent, #6366f1); color: #fff; border: none; cursor: pointer; transition: all 0.2s ease;">
            <i class="fas fa-spinner fa-spin" style="display:none; margin-right: 8px;"></i>
            <span>Daha çox göstər</span>
          </button>
        </div>
      </section>
