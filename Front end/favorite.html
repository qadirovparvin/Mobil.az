<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="JS/config.js?v=20261112_2"></script>
    <title>Seçilmişlər - Mobilim.az</title>
    <link rel="stylesheet" href="CSS/general.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        .favorites-page {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .favorites-page h1 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .favorites-page h1 i {
            color: #e74c3c;
        }

        #favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .empty-favorites {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            grid-column: 1 / -1;
        }

        .empty-favorites i {
            font-size: 3rem;
            margin-bottom: 16px;
            color: #ccc;
        }

        .empty-favorites p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .empty-favorites a {
            display: inline-block;
            background: #6c3fc5;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .empty-favorites a:hover {
            background: #5430a8;
        }

        .favorite-btn.favorited i {
            color: #e74c3c;
        }

        .fav-count {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 20px;
        }
    </style>
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('mobilaz_theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body>
      <div id="header-placeholder"></div>

    <main>
        <div class="favorites-page">
            <h1 data-translate="fav-h1"><i class="fas fa-heart"></i> Seçilmişlər</h1>
            <p class="fav-count" id="fav-count"></p>
            <div id="fav-actions" style="margin-bottom:20px;display:none;align-items:center;gap:15px;flex-wrap:wrap;">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;">
                    <input type="checkbox" id="fav-select-all" style="width:18px;height:18px;cursor:pointer;"> 
                    <span data-translate="fav-select-all">Hamısını seç</span>
                </label>
                <button id="btn-delete-selected" style="background:#e74c3c;color:white;border:none;padding:8px 15px;border-radius:6px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;">
                    <i class="fas fa-trash"></i> <span data-translate="fav-delete-selected">Seçilənləri sil</span>
                </button>
                <button id="btn-delete-all" style="background:#555;color:white;border:none;padding:8px 15px;border-radius:6px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;">
                    <i class="fas fa-ban"></i> <span data-translate="fav-delete-all">Hamısını sil</span>
                </button>
            </div>
            <div id="favorites-grid">
                <!-- Favorited cards injected by JS -->
            </div>
        </div>
    </main>

      <div id="footer-placeholder"></div>

    
    <script src="JS/axios.min.js"></script>
    <script src="JS/api.js?v=20261112_2"></script>
    <script src="JS/auth.js?v=20261112_2"></script>
    <script src="JS/script.js?v=20261112_2"></script>
    <script src="JS/favorites.js?v=20261112_2"></script>
    <script src="JS/components.js?v=20261112_2"></script>
</body>

</html>
