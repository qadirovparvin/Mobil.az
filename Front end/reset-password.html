<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate-title="auth-reset-page-title">Şifrəni yenilə - Mobilim.az</title>
    <meta name="description" content="Mobilim.az hesabınızın yeni şifrəsini təyin edin.">
    <link rel="stylesheet" href="CSS/general.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('mobilaz_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <script src="JS/config.js"></script>
</head>

<body class="auth-page">
    <!-- ── HEADER ───────────────────────────────────────────── -->
    <div id="header-placeholder"></div>

    <!-- ── MAIN AUTH SHELL ──────────────────────────────────── -->
    <div class="auth-shell">

        <!-- Left branded panel -->
        <aside class="auth-brand">
            <div class="auth-brand-blobs">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                <div class="blob blob-3"></div>
            </div>
            <div class="auth-brand-logo">Mobil<span>.az</span></div>
            <h1 class="auth-brand-title" data-translate="auth-welcome">Xoş gəldiniz!</h1>
            <p class="auth-brand-sub" data-translate="auth-brand-sub">Azərbaycanın ən böyük telefon bazarına daxil olun.</p>
            <div class="auth-brand-features">
                <div class="auth-brand-feat"><i class="fas fa-shield-alt"></i><span data-translate="auth-feat-1">SSL ilə qorunan giriş</span></div>
                <div class="auth-brand-feat"><i class="fas fa-bolt"></i><span data-translate="auth-feat-2">Sürətli və etibarlı</span></div>
                <div class="auth-brand-feat"><i class="fas fa-mobile-alt"></i><span data-translate="auth-feat-3">50,000+ telefon elanı</span></div>
                <div class="auth-brand-feat"><i class="fas fa-headset"></i><span data-translate="auth-feat-4">24/7 dəstək xidməti</span></div>
            </div>
        </aside>

        <!-- Right form panel -->
        <main class="auth-form-panel">
            <div class="auth-form-box">
                <h2 class="auth-heading" data-translate="auth-reset-title">Yeni şifrə təyin et</h2>
                <p class="auth-subheading" data-translate="auth-reset-subtitle">Hesabınız üçün yeni və güclü bir şifrə daxil edin.</p>

                <!-- reset password form -->
                <form id="resetPasswordForm" novalidate>
                    <div class="input-group">
                        <label for="resetPassword" data-translate="auth-pwd">Yeni şifrə</label>
                        <input type="password" id="resetPassword" placeholder="••••••••" required oninput="checkPasswordStrength(this.value)">
                        <i class="fas fa-lock input-icon"></i>
                        <i class="fas fa-eye toggle-password" id="toggleResetPwd" onclick="togglePwd('resetPassword','toggleResetPwd')"></i>
                    </div>

                    <!-- Password strength visualizer -->
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>

                    <div class="input-group">
                        <label for="confirmResetPassword" data-translate="auth-pwd-confirm">Yeni şifrənin təkrarı</label>
                        <input type="password" id="confirmResetPassword" placeholder="••••••••" required>
                        <i class="fas fa-lock input-icon"></i>
                        <i class="fas fa-eye toggle-password" id="toggleConfirmResetPwd" onclick="togglePwd('confirmResetPassword','toggleConfirmResetPwd')"></i>
                    </div>

                    <button type="submit" class="auth-submit-btn" id="resetSubmitBtn">
                        <span class="btn-text" data-translate="auth-btn-reset">Şifrəni yenilə</span>
                        <span class="btn-spinner"></span>
                    </button>
                </form>

                <p class="auth-switch-link">
                    <a href="login.html" data-translate="auth-back-to-login">← Giriş səhifəsinə qayıt</a>
                </p>
            </div>
        </main>
    </div>

    <!-- ── FOOTER ────────────────────────────────────────────── -->
    <div id="footer-placeholder"></div>

    <!-- ── TOAST ─────────────────────────────────────────────── -->
    <div class="auth-toast" id="authToast" role="alert" aria-live="polite">
        <i class="fas fa-circle-check" id="toastIcon"></i>
        <span id="toastMsg"></span>
    </div>

    
    <script src="JS/auth.js"></script>
    <script src="JS/auth-otp.js"></script>
    <script src="JS/script.js"></script>
  <script src="JS/components.js"></script>
</body>
</html>
