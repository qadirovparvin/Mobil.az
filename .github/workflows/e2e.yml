name: Mobilim.az Release Qualification (E2E & Security)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Release Gate Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      BASE_URL: http://127.0.0.1:5500
      BACKEND_URL: http://localhost:5000
      PAYMENT_PROVIDER: mock
      ALLOW_MOCK_SIGNATURE: "true"
      JWT_SECRET: "test-release-gate-secret-must-be-at-least-32-chars-long"
      CSRF_SECRET: "test-csrf-release-gate-secret-must-be-at-least-32-chars-long"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          npm ci || npm install
          npm --prefix Backend ci || npm --prefix Backend install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Syntax & Controller Validation (Check)
        run: npm run check

      - name: Run Security Regression Suite
        run: npm run test:security

      - name: Start Backend API Daemon
        run: |
          node Backend/ensure_backend.js &
          npx wait-on http-get://localhost:5000/api/health --timeout 15000

      - name: Run Full Playwright E2E Suite
        run: npm run test:e2e

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
